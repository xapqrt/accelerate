<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Tic-Tac-Toe</title>
<style>
body{background:#000;color:#fff;font-family:monospace;margin:0;padding:0;overflow:auto;min-height:100vh;}
#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;}
#container{position:relative;z-index:1;padding:40px;}
#title{text-align:center;font-size:36px;color:#fff;margin-bottom:30px;}
#canvas{display:block;margin:0 auto;border:3px solid #fff;background:rgba(0,0,0,0.9);}
#status{text-align:center;font-size:18px;margin-top:20px;color:#fff;}
button{background:#fff;color:#000;border:none;padding:10px 20px;font-family:monospace;cursor:pointer;margin:10px 5px;}
button:hover{background:#ccc;}
#controls{text-align:center;margin-top:15px;}
</style>
</head>
<body>
<canvas id='bg-canvas'></canvas>
<div id='container'>
<div id='title'>Chaotic Tic-Tac-Toe</div>
<div style='text-align:center;color:#ff8800;font-size:14px;margin-bottom:20px;'>Each pendulum swings wildly and STEALS opponent cells on contact!</div>
<canvas id='canvas' width='600' height='600'></canvas>
<div id='status'>Your turn</div>
<div id='controls'><button onclick='resetGame()'>Reset</button></div>
</div>
<script src='physics.js'></script>
<script src='euler.js'></script>
<script src='canvas-utils.js'></script>
<script src='minimax.js'></script>
<script>
const bgCanvas=document.getElementById('bg-canvas');const bgCtx=bgCanvas.getContext('2d');bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;const bgPendulums=[];for(let i=0;i<25;i++){bgPendulums.push({theta1:Math.random()*Math.PI*2,theta2:Math.random()*Math.PI*2,omega1:(Math.random()-0.5)*3,omega2:(Math.random()-0.5)*3,m1:1,m2:1,L1:50+Math.random()*40,L2:50+Math.random()*40,x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight});}function updateBG(){fadeCanvas(bgCtx,bgCanvas.width,bgCanvas.height,0.05);for(let p of bgPendulums){integrate_euler(p,0.08);const c=polarToCartesian(p.theta1,p.theta2,p.L1,p.L2,p.x,p.y);bgCtx.strokeStyle='rgba(255,255,255,0.3)';bgCtx.lineWidth=1;bgCtx.beginPath();bgCtx.moveTo(p.x,p.y);bgCtx.lineTo(c.x1|0,c.y1|0);bgCtx.lineTo(c.x2|0,c.y2|0);bgCtx.stroke();}}const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const cellSize=200;const board=Array(9).fill(null);const pendulums=[];let gameOver=false;let currentPlayer='X';function getCellCenter(index){const row=Math.floor(index/3);const col=index%3;return{x:col*cellSize+cellSize/2,y:row*cellSize+cellSize/2};}function drawGrid(){ctx.strokeStyle='#666';ctx.lineWidth=2;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*cellSize,0);ctx.lineTo(i*cellSize,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cellSize);ctx.lineTo(canvas.width,i*cellSize);ctx.stroke();}}function drawBoard(){for(let i=0;i<9;i++){if(board[i]==='X'){const {x,y}=getCellCenter(i);ctx.strokeStyle='#ff4444';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-40,y-40);ctx.lineTo(x+40,y+40);ctx.moveTo(x+40,y-40);ctx.lineTo(x-40,y+40);ctx.stroke();}else if(board[i]==='O'){const {x,y}=getCellCenter(i);ctx.strokeStyle='#4444ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,40,0,Math.PI*2);ctx.stroke();}}}function spawnPendulum(index,player){const {x,y}=getCellCenter(index);pendulums.push({theta1:Math.random()*Math.PI*2,theta2:Math.random()*Math.PI*2,omega1:(Math.random()-0.5)*6,omega2:(Math.random()-0.5)*6,m1:1,m2:1,L1:100,L2:100,centerX:x,centerY:y,player:player,cell:index,energy:50});}function checkChaos(){for(let p of pendulums){const c=polarToCartesian(p.theta1,p.theta2,p.L1,p.L2,p.centerX,p.centerY);for(let i=0;i<9;i++){if(board[i]&&board[i]!==p.player&&i!==p.cell){const {x,y}=getCellCenter(i);const dx=c.x2-x;const dy=c.y2-y;const distSq=dx*dx+dy*dy;if(distSq<2500){p.energy--;if(p.energy<=0){p.energy=50;board[i]=p.player;p.cell=i;const newCenter=getCellCenter(i);p.centerX=newCenter.x;p.centerY=newCenter.y;canvas.style.filter='brightness(1.5)';setTimeout(()=>{canvas.style.filter='brightness(1)'},80);document.getElementById('status').innerHTML='<span style="color:#ff4400">💥 CHAOS! '+p.player+' STOLE CELL '+i+'!</span>';const winner=checkWinner(board);if(winner){gameOver=true;setTimeout(()=>{document.getElementById('status').textContent=winner+' wins!'},1600);return;}if(isBoardFull(board)){gameOver=true;setTimeout(()=>{document.getElementById('status').textContent='Draw!'},1600);return;}setTimeout(()=>{if(!gameOver&&currentPlayer)document.getElementById('status').textContent=currentPlayer+"'s turn";},1500);}}}}}}function updatePendulums(){for(let p of pendulums){integrate_euler(p,0.04);}checkChaos();}function drawPendulums(){for(let p of pendulums){const c=polarToCartesian(p.theta1,p.theta2,p.L1,p.L2,p.centerX,p.centerY);ctx.strokeStyle=p.player==='X'?'rgba(255,68,68,0.8)':'rgba(68,68,255,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.centerX,p.centerY);ctx.lineTo(c.x1|0,c.y1|0);ctx.lineTo(c.x2|0,c.y2|0);ctx.stroke();ctx.fillStyle=p.player==='X'?'#ff4444':'#4444ff';ctx.beginPath();ctx.arc(c.x2|0,c.y2|0,8,0,Math.PI*2);ctx.fill();if(p.energy<50){ctx.fillStyle='#ffff00';ctx.font='10px monospace';ctx.fillText(p.energy,c.x2-5,c.y2-15);}}}function handleClick(e){if(gameOver||currentPlayer!=='X')return;const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;const col=Math.floor(x/cellSize);const row=Math.floor(y/cellSize);const index=row*3+col;if(index<0||index>8||board[index])return;board[index]='X';spawnPendulum(index,'X');const winner=checkWinner(board);if(winner){gameOver=true;document.getElementById('status').textContent=winner+' wins!';return;}if(isBoardFull(board)){gameOver=true;document.getElementById('status').textContent='Draw!';return;}currentPlayer='O';document.getElementById('status').textContent='AI thinking...';setTimeout(aiMove,400);}function aiMove(){const move=getBestMove(board,'O','X');board[move]='O';spawnPendulum(move,'O');const winner=checkWinner(board);if(winner){gameOver=true;document.getElementById('status').textContent=winner+' wins!';return;}if(isBoardFull(board)){gameOver=true;document.getElementById('status').textContent='Draw!';return;}currentPlayer='X';document.getElementById('status').textContent='Your turn';}function resetGame(){board.fill(null);pendulums.length=0;gameOver=false;currentPlayer='X';document.getElementById('status').textContent='Your turn';}function animate(){updateBG();clearCanvas(ctx,canvas.width,canvas.height);drawGrid();drawBoard();updatePendulums();drawPendulums();requestAnimationFrame(animate);}canvas.addEventListener('click',handleClick);animate();console.log('tictactoe loaded');console.log('checkWinner available:',typeof checkWinner);console.log('isBoardFull available:',typeof isBoardFull);
</script>
</body>
</html>
