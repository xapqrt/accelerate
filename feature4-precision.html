<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chaos Control Challenge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#0f0;font-family:monospace;overflow:auto;padding:15px;}
#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;}
#container{position:relative;z-index:1;max-width:950px;margin:0 auto;}
#title{text-align:center;font-size:22px;color:#0f0;margin-bottom:8px;}
#subtitle{text-align:center;font-size:11px;color:#888;margin-bottom:15px;}
#canvas{display:block;margin:0 auto;border:1px solid #333;background:#000;}


/* minimal controls */
#controls{background:#0a0a0a;border:1px solid #1a1a1a;padding:10px;margin:12px 0;}
.slider-row{margin:8px 0;display:flex;align-items:center;gap:6px;}
.slider-label{min-width:55px;color:#666;font-size:11px;}
.slider{flex:1;height:20px;background:#111;border:1px solid #222;outline:none;cursor:pointer;}
.slider::-webkit-slider-thumb{background:#0f0;width:12px;height:20px;cursor:pointer;}
.value-display{min-width:90px;text-align:right;color:#0f0;font-size:11px;font-family:monospace;}


#buttons{text-align:center;margin:10px 0;}
.btn{background:#0f0;color:#000;border:none;padding:8px 18px;font-family:monospace;font-size:12px;cursor:pointer;margin:3px 4px;font-weight:bold;}
.btn:hover{background:#0ff;}
.btn:active{transform:scale(0.95);}
.btn.secondary{background:#222;color:#666;border:1px solid #333;}
.btn.secondary:hover{background:#333;color:#0f0;}


/* compact stats */
#stats{background:#0a0a0a;border:1px solid #1a1a1a;padding:8px;margin:10px 0;display:flex;justify-content:space-around;font-size:11px;color:#666;}
.stat{text-align:center;}
.stat-value{color:#0f0;font-weight:bold;margin-left:4px;}


#message{text-align:center;font-size:12px;margin:8px 0;color:#ff0;min-height:18px;}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="container">
<div id="title">CHAOS CONTROL</div>
<div id="subtitle">microscopic precision butterfly effect challenge</div>
<canvas id="canvas" width="800" height="550"></canvas>


<!-- minimal controls -->
<div id="controls">
<div class="slider-row">
<span class="slider-label">θ₁</span>
<input type="range" class="slider" id="theta1" min="0" max="6283185" step="1" value="3141592">
<span class="value-display" id="theta1-val">3.141592</span>
</div>
<div class="slider-row">
<span class="slider-label">θ₂</span>
<input type="range" class="slider" id="theta2" min="0" max="6283185" step="1" value="3141592">
<span class="value-display" id="theta2-val">3.141592</span>
</div>
<div class="slider-row">
<span class="slider-label">ω₁</span>
<input type="range" class="slider" id="omega1" min="-2000000" max="2000000" step="1" value="0">
<span class="value-display" id="omega1-val">0.000000</span>
</div>
<div class="slider-row">
<span class="slider-label">ω₂</span>
<input type="range" class="slider" id="omega2" min="-2000000" max="2000000" step="1" value="0">
<span class="value-display" id="omega2-val">0.000000</span>
</div>
</div>


<div id="buttons">
<button class="btn" onclick="launch()">LAUNCH</button>
<button class="btn secondary" onclick="resetSim()">reset</button>
<button class="btn secondary" onclick="randomize()">random</button>
<button class="btn secondary" onclick="newGong()">new target</button>
</div>


<!-- compact stats -->
<div id="stats">
<div class="stat">attempts: <span class="stat-value" id="attempts">0</span></div>
<div class="stat">hits: <span class="stat-value" id="hits">0</span></div>
<div class="stat">best: <span class="stat-value" id="bestDist">∞</span></div>
<div class="stat">rate: <span class="stat-value" id="hitRate">0%</span></div>
</div>


<div id="message">adjust sliders with microscopic precision...</div>
</div>
<script src="physics.js"></script>
<script src="euler.js"></script>
<script src="canvas-utils.js"></script>
<script>
const cnv=document.getElementById('canvas');
const ctx=cnv.getContext('2d');
const cX=cnv.width/2;
const cY=cnv.height/2;


// pendulum state
const pend={
theta1:Math.PI,
theta2:Math.PI,
omega1:0,
omega2:0,
m1:1,m2:1,
L1:140,L2:140
};

let trail=[];
let launched=false;
let steps=0;  // sim steps
const MAX_STEPS=600;  // no time limit, just max trajectory points


// multiple targets with different scores
let targets=[];
function initTargets(){
targets=[
{x:cX+220,y:cY-120,r:25,score:10,color:'#ff0',hit:false,label:'10'},
{x:cX-200,y:cY+80,r:30,score:5,color:'#f80',hit:false,label:'5'},
{x:cX+100,y:cY-200,r:20,score:15,color:'#0ff',hit:false,label:'15'},
{x:cX-280,y:cY-50,r:35,score:3,color:'#f0f',hit:false,label:'3'}
];
}
initTargets();


// obstacles (walls that pendulum cant cross)
let obstacles=[];
function initObstacles(){
obstacles=[
{x:cX+50,y:cY-80,w:120,h:15},
{x:cX-170,y:cY+20,w:15,h:100},
{x:cX+180,y:cY+50,w:80,h:12}
];
}
initObstacles();


// game stats
let attempts=0;
let totalScore=0;
let hits=0;
let best_dist=Infinity;


// microsecond precision sliders (6 decimal places)
function updateSliders(){
const t1=parseInt(document.getElementById('theta1').value)/1000000;
const t2=parseInt(document.getElementById('theta2').value)/1000000;
const w1=parseInt(document.getElementById('omega1').value)/1000000;
const w2=parseInt(document.getElementById('omega2').value)/1000000;

document.getElementById('theta1-val').textContent=t1.toFixed(6);
document.getElementById('theta2-val').textContent=t2.toFixed(6);
document.getElementById('omega1-val').textContent=w1.toFixed(6);
document.getElementById('omega2-val').textContent=w2.toFixed(6);

// update pendulum if not launched
if(!launched){
pend.theta1=t1;
pend.theta2=t2;
pend.omega1=w1;
pend.omega2=w2;
}
}

document.getElementById('theta1').addEventListener('input',updateSliders);
document.getElementById('theta2').addEventListener('input',updateSliders);
document.getElementById('omega1').addEventListener('input',updateSliders);
document.getElementById('omega2').addEventListener('input',updateSliders);


function launch(){
if(launched)return;

updateSliders();
launched=true;
steps=0;
trail=[];

// reset target hit states
targets.forEach(t=>t.hit=false);
attempts++;

console.log('🚀 launch:', pend.theta1.toFixed(6), pend.theta2.toFixed(6), pend.omega1.toFixed(6), pend.omega2.toFixed(6));
document.getElementById('message').textContent='simulating...';
document.getElementById('attempts').textContent=attempts;
}


function resetSim(){
pend.theta1=Math.PI;
pend.theta2=Math.PI;
pend.omega1=0;
pend.omega2=0;
trail=[];
launched=false;
steps=0;

document.getElementById('theta1').value=3141592;
document.getElementById('theta2').value=3141592;
document.getElementById('omega1').value=0;
document.getElementById('omega2').value=0;
updateSliders();

document.getElementById('message').textContent='reset';
}


function randomize(){
// random initial conditions
const r1=Math.floor(Math.random()*6283185);
const r2=Math.floor(Math.random()*6283185);
const r3=Math.floor(Math.random()*4000000-2000000);
const r4=Math.floor(Math.random()*4000000-2000000);

document.getElementById('theta1').value=r1;
document.getElementById('theta2').value=r2;
document.getElementById('omega1').value=r3;
document.getElementById('omega2').value=r4;
updateSliders();

document.getElementById('message').textContent='randomized';
}


// new target positions
function newGong(){
initTargets();
initObstacles();
document.getElementById('message').textContent='new targets spawned!';
}


function update(){
if(!launched)return;


// integrate
integrate_euler(pend,0.025);
steps++;


const coords=polarToCartesian(pend.theta1,pend.theta2,pend.L1,pend.L2,cX,cY);
trail.push({x:coords.x2,y:coords.y2});
if(trail.length>MAX_STEPS)trail.shift();


// check all targets
let scoreThisFrame=0;
for(let tgt of targets){
if(tgt.hit)continue;

const dx=coords.x2-tgt.x;
const dy=coords.y2-tgt.y;
const distSq=dx*dx+dy*dy;

if(distSq<tgt.r*tgt.r){
tgt.hit=true;
scoreThisFrame+=tgt.score;
hits++;
console.log('💥 HIT target! +'+tgt.score+' pts');
}

// track best distance to ANY target
const dist=Math.sqrt(distSq);
if(dist<best_dist){
best_dist=dist;
document.getElementById('bestDist').textContent=dist.toFixed(1)+'px';
}
}

if(scoreThisFrame>0){
totalScore+=scoreThisFrame;
document.getElementById('message').textContent=`+${scoreThisFrame} points! Total: ${totalScore}`;
document.getElementById('hits').textContent=hits;
document.getElementById('hitRate').textContent=((hits/attempts)*100).toFixed(0)+'%';
}


// end sim after max steps
if(steps>=MAX_STEPS){
launched=false;
const hitCount=targets.filter(t=>t.hit).length;
if(hitCount===0){
document.getElementById('message').textContent='miss! try adjusting by tiny amounts';
}else{
document.getElementById('message').textContent=`${hitCount} targets hit! score: ${totalScore}`;
}
}
}


// render everything
function render(){
ctx.fillStyle='#000';
ctx.fillRect(0,0,cnv.width,cnv.height);


// obstacles (walls)
ctx.fillStyle='#222';
for(let obs of obstacles){
ctx.fillRect(obs.x,obs.y,obs.w,obs.h);
ctx.strokeStyle='#333';
ctx.lineWidth=1;
ctx.strokeRect(obs.x,obs.y,obs.w,obs.h);
}


// targets
for(let tgt of targets){
ctx.strokeStyle=tgt.hit?'#333':tgt.color;
ctx.lineWidth=tgt.hit?1:3;
ctx.beginPath();
ctx.arc(tgt.x,tgt.y,tgt.r,0,Math.PI*2);
ctx.stroke();

if(!tgt.hit){
ctx.fillStyle=tgt.color+'22';
ctx.fill();

ctx.fillStyle=tgt.color;
ctx.font='14px monospace';
ctx.textAlign='center';
ctx.fillText(tgt.label,tgt.x,tgt.y+5);
}else{
ctx.fillStyle='#111';
ctx.fill();
}
}


// trail
if(trail.length>1){
ctx.strokeStyle='#0f0';
ctx.lineWidth=1.5;
ctx.beginPath();
for(let i=0;i<trail.length;i++){
const alpha=(i/trail.length)*0.6;
ctx.strokeStyle=`rgba(0,255,0,${alpha})`;
if(i===0)ctx.moveTo(trail[i].x,trail[i].y);
else ctx.lineTo(trail[i].x,trail[i].y);
}
ctx.stroke();
}


// pendulum
const c=polarToCartesian(pend.theta1,pend.theta2,pend.L1,pend.L2,cX,cY);
ctx.strokeStyle='#0f0';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(cX,cY);
ctx.lineTo(c.x1,c.y1);
ctx.lineTo(c.x2,c.y2);
ctx.stroke();

// pivot
ctx.fillStyle='#0f0';
ctx.beginPath();
ctx.arc(cX,cY,4,0,Math.PI*2);
ctx.fill();

// bob 1
ctx.fillStyle='#0f0';
ctx.beginPath();
ctx.arc(c.x1,c.y1,7,0,Math.PI*2);
ctx.fill();

// bob 2
ctx.fillStyle='#ff0';
ctx.beginPath();
ctx.arc(c.x2,c.y2,9,0,Math.PI*2);
ctx.fill();


// step counter
if(launched){
const remaining=MAX_STEPS-steps;
ctx.fillStyle='#666';
ctx.font='11px monospace';
ctx.textAlign='left';
ctx.fillText(`steps: ${steps}/${MAX_STEPS}`,10,20);
}


// score display
ctx.fillStyle='#0f0';
ctx.font='11px monospace';
ctx.textAlign='right';
ctx.fillText(`total score: ${totalScore}`,cnv.width-10,20);
}


// bg pendulums for ambiance
const bgCanvas=document.getElementById('bg-canvas');
const bgCtx=bgCanvas.getContext('2d');
bgCanvas.width=window.innerWidth;
bgCanvas.height=window.innerHeight;
const bgPends=[];

// fewer bg pendulums (less distraction)
for(let i=0;i<12;i++){
bgPends.push({
theta1:Math.random()*Math.PI*2,
theta2:Math.random()*Math.PI*2,
omega1:(Math.random()-0.5)*1.5,
omega2:(Math.random()-0.5)*1.5,
m1:1,m2:1,
L1:35+Math.random()*25,
L2:35+Math.random()*25,
x:Math.random()*window.innerWidth,
y:Math.random()*window.innerHeight
});
}

function updateBG(){
fadeCanvas(bgCtx,bgCanvas.width,bgCanvas.height,0.06);
for(let p of bgPends){
integrate_euler(p,0.08);
const c=polarToCartesian(p.theta1,p.theta2,p.L1,p.L2,p.x,p.y);
bgCtx.strokeStyle='rgba(0,255,0,0.1)';
bgCtx.lineWidth=1;
bgCtx.beginPath();
bgCtx.moveTo(p.x,p.y);
bgCtx.lineTo(c.x1,c.y1);
bgCtx.lineTo(c.x2,c.y2);
bgCtx.stroke();
}
}

function animate(){
updateBG();
update();
render();
requestAnimationFrame(animate);
}

updateSliders();
animate();
console.log('⚡ chaos control loaded');
</script>
</body>
</html>
