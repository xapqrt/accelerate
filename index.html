<script src="physics.js"></script>
<script src="euler.js"></script>
<script src="canvas-utils.js"></script>
<script>
const canvas=document.getElementById('bg-canvas')
const ctx=canvas.getContext('2d')

canvas.width=window.innerWidth
canvas.height=window.innerHeight

const pendulums=[]
for(let i=0;i<40;i++){
pendulums.push({
    
theta1:Math.random()*Math.PI*2,
theta2:Math.random()*Math.PI*2,
omega1:(Math.random()-0.5)*4,
omega2:(Math.random()-0.5)*4,
m1:1,m2:1,
L1:60+Math.random()*50,
L2:60+Math.random()*50,
x:Math.random()*canvas.width,
y:Math.random()*canvas.height
})
}

function animate(){
fadeCanvas(ctx,canvas.width,canvas.height,0.04)
for(let p of pendulums){
integrate_euler(p,0.08)
const c=polarToCartesian(p.theta1,p.theta2,p.L1,p.L2,p.x,p.y)
ctx.strokeStyle='rgba(255,255,255,0.5)'
ctx.lineWidth=1
ctx.beginPath()
ctx.moveTo(p.x,p.y)
ctx.lineTo(c.x1|0,c.y1|0)
ctx.lineTo(c.x2|0,c.y2|0)
ctx.stroke()
}
requestAnimationFrame(animate)
}

animate()
</script>

</body>
